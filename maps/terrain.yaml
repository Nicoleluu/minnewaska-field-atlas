type: map
id: minnewaska
config:
  mapStyle: "street-style.json?v=osm-standard"
  center: [-74.253, 41.731]
  zoom: 11.5
controls:
  navigation: { enabled: true, position: top-right }
  scale: { enabled: true, position: bottom-left }
legend: false
layers:
  - id: candidates
    label: Forested slopes
    type: fill
    toggleable: false
    visible: false
    source: {type: geojson, url: data/slopes.geojson}
    paint:
      fill-color: ["match", ["get", "aspect"], North, "#147973", "#d87e32"]
      fill-opacity: 0.50
  - id: study-hit-area
    type: fill
    label: Explore landscape
    toggleable: false
    source: {type: geojson, url: data/boundary.geojson}
    paint: {fill-opacity: 0}
  - id: study-boundary
    type: line
    label: Study boundary
    toggleable: false
    source: {type: geojson, url: data/boundary.geojson}
    paint: {line-color: "#354a4d", line-width: 1.4}
  - id: historical-trails
    type: line
    label: Historical trails
    toggleable: false
    source: {type: geojson, url: data/trails.geojson}
    paint: {line-color: "#504d49", line-width: 1.15, line-dasharray: [3, 2]}
